[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["garnets"]
norecursedirs = ["docs/references", "StarGenCode", ".git", ".mypy_cache"]

[tool.tidypy]
exclude = [
    '.mypy_cache/.*',
    'docs/references/.*',
    'StarGenCode/.*'
]

[tool.tidypy.pydocstyle]
disabled = [
    'D105',
    'D203',
    'D213'
]

[tool.tidypy.pylint]
disabled = [
    'len-as-condition',
    'fixme',
    'not-an-iterable'
]

[tool.tidypy.pyroma]
disabled = [
	'ValidREST',
	'PythonVersion'
]
